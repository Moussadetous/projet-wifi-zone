name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  compile:
    name: Compilation Kotlin (rapide)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle --no-daemon --continue :core:test :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin

  php:
    name: PHP pour Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: out/php/${{ matrix.abi }}
          key: php-${{ matrix.abi }}-${{ hashFiles('scripts/build-php-android.sh') }}
      - name: Compiler PHP avec le NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/build-php-android.sh ${{ matrix.abi }} out/php/${{ matrix.abi }}
      - uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.abi }}
          path: out/php/${{ matrix.abi }}/libphp.so

  apk:
    name: APK + tests sur émulateur
    needs: php
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - uses: actions/download-artifact@v4
        with: { pattern: php-*, path: out/php }
      - name: Installer PHP dans l'APK
        run: |
          for abi in arm64-v8a x86_64; do
            install -D -m 755 out/php/php-$abi/libphp.so app/src/main/jniLibs/$abi/libphp.so
          done
      - name: Télécharger Mikhmon
        run: ./scripts/fetch-mikhmon.sh
      # Clé de signature stable : secret du dépôt si présent (recommandé), sinon clé gardée en cache.
      - name: Clé de signature (cache)
        uses: actions/cache/restore@v4
        with:
          path: ~/.mikhmon-signing
          key: mikhmon-signing-v1
      - name: Clé de signature
        id: sign
        env:
          KS_B64: ${{ secrets.MIKHMON_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.MIKHMON_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ~/.mikhmon-signing
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > ~/.mikhmon-signing/secret.jks
            echo "MIKHMON_KEYSTORE=$HOME/.mikhmon-signing/secret.jks" >> $GITHUB_ENV
            echo "MIKHMON_KEYSTORE_PASSWORD=$KS_PASS" >> $GITHUB_ENV
            echo "Signature : clé du secret MIKHMON_KEYSTORE_B64"
          else
            if [ ! -f ~/.mikhmon-signing/ci.jks ]; then
              echo "generated=true" >> $GITHUB_OUTPUT
              keytool -genkeypair -keystore ~/.mikhmon-signing/ci.jks -storepass mikhmon-ci-key -keypass mikhmon-ci-key \
                -alias mikhmon -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Mikhmon Android, O=WiFi Zone"
            fi
            echo "MIKHMON_KEYSTORE=$HOME/.mikhmon-signing/ci.jks" >> $GITHUB_ENV
            echo "MIKHMON_KEYSTORE_PASSWORD=mikhmon-ci-key" >> $GITHUB_ENV
            echo "Signature : clé de la CI (ajoutez le secret MIKHMON_KEYSTORE_B64 pour une clé définitive)"
          fi
      - name: Garder la clé de la CI
        uses: actions/cache/save@v4
        if: always() && steps.sign.outputs.generated == 'true'
        continue-on-error: true
        with:
          path: ~/.mikhmon-signing
          key: mikhmon-signing-v1
      - name: Tests unitaires + APK
        run: gradle --no-daemon :core:test :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
      - name: Préparer les APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Mikhmon-Android.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/Mikhmon-Android-debug.apk
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: mikhmon-apk
          path: dist/Mikhmon-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mikhmon-debug-apk
          path: dist/Mikhmon-Android-debug.apk
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tests sur émulateur Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          profile: pixel_6
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest || touch tests-failed
            adb logcat -d > logcat.txt || true
            mkdir -p screens && for f in $(adb shell ls /data/local/tmp/ | tr -d '\r' | grep '^mikhmon-.*png$'); do adb pull /data/local/tmp/$f screens/ || true; done
            test ! -f tests-failed
      - name: Rapport PDF et captures (journal)
        if: always()
        run: |
          grep -h "page(s)," logcat.txt | sed 's/.*System.out: //' | sort -u | head -80 || true
          grep -hE "UiFlowTest|PdfTest.*par feuille|I WireGuard/GoBackend|E WireGuard" logcat.txt | grep -v "page(s)," | head -60 || true
          for f in screens/*.png; do
            [ -f "$f" ] || continue
            convert "$f" -resize 36% -quality 68 "${f%.png}.jpg" || cp "$f" "${f%.png}.jpg"
            echo "SCREENSHOT-BEGIN $f"; base64 -w 0 "${f%.png}.jpg"; echo; echo "SCREENSHOT-END"
          done
      - name: Rapports de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            core/build/reports/tests/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            logcat.txt
            screens/
