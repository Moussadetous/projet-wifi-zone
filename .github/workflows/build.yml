name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  compile:
    name: Compilation Kotlin (rapide)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle --no-daemon --continue :core:test :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin

  php:
    name: PHP pour Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: out/php/${{ matrix.abi }}
          key: php-${{ matrix.abi }}-${{ hashFiles('scripts/build-php-android.sh') }}
      - name: Compiler PHP avec le NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/build-php-android.sh ${{ matrix.abi }} out/php/${{ matrix.abi }}
      - uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.abi }}
          path: out/php/${{ matrix.abi }}/libphp.so

  apk:
    name: APK + tests sur émulateur
    needs: php
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - uses: actions/download-artifact@v4
        with: { pattern: php-*, path: out/php }
      - name: Installer PHP dans l'APK
        run: |
          for abi in arm64-v8a x86_64; do
            install -D -m 755 out/php/php-$abi/libphp.so app/src/main/jniLibs/$abi/libphp.so
          done
      - name: Télécharger Mikhmon
        run: ./scripts/fetch-mikhmon.sh
      - name: Tests unitaires + APK
        run: gradle --no-daemon :core:test :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: mikhmon-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tests sur émulateur Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          profile: pixel_6
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest || touch tests-failed
            adb logcat -d > logcat.txt || true
            mkdir -p screens && for n in 1-configuration 2-demarrage 3-mikhmon; do adb pull /data/local/tmp/mikhmon-$n.png screens/ || true; done
            test ! -f tests-failed
      - name: Captures d'écran (journal)
        if: always()
        run: |
          for f in screens/*.png; do
            [ -f "$f" ] || continue
            convert "$f" -resize 40% -quality 70 "${f%.png}.jpg" || cp "$f" "${f%.png}.jpg"
            echo "SCREENSHOT-BEGIN $f"; base64 -w 0 "${f%.png}.jpg"; echo; echo "SCREENSHOT-END"
          done
      - name: Rapports de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            core/build/reports/tests/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            logcat.txt
            screens/
